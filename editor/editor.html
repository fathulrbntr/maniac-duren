<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maniac Duren Visual Editor</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/grapesjs/dist/css/grapes.min.css"
  >
  <link rel="stylesheet" href="editor.css">
</head>

<body>

  <header class="editor-topbar">
    <div class="editor-brand">
      <strong>MANIAC DUREN</strong>
      <span>Visual Editor</span>
    </div>

    <div class="editor-devices" aria-label="Responsive preview">
      <button type="button" data-device="Desktop" class="device-button active">
        Desktop
      </button>

      <button type="button" data-device="Tablet" class="device-button">
        Tablet
      </button>

      <button type="button" data-device="Mobile" class="device-button">
        Mobile
      </button>
    </div>

    <div class="editor-actions">
      <button type="button" id="reload-original">
        Reload Project
      </button>

      <button type="button" id="save-local" class="primary">
        Save Draft
      </button>

      <button type="button" id="export-project">
        Export HTML + CSS
      </button>
    </div>
  </header>

  <main class="editor-shell">

    <aside class="editor-sidebar left-sidebar">

      <section class="sidebar-panel">
        <div class="panel-title">Blocks</div>
        <div id="blocks"></div>
      </section>

      <section class="sidebar-panel layers-panel">
        <div class="panel-title">Layers</div>
        <div id="layers"></div>
      </section>

    </aside>

    <section class="editor-workspace">
      <div id="gjs"></div>
    </section>

    <aside class="editor-sidebar right-sidebar">

      <section class="sidebar-panel">
        <div class="panel-title">Styles</div>
        <div id="styles"></div>
      </section>

      <section class="sidebar-panel">
        <div class="panel-title">Properties</div>
        <div id="traits"></div>
      </section>

    </aside>

  </main>

  <div class="editor-status" id="editor-status">
    Loading Maniac Duren...
  </div>

  <script src="https://unpkg.com/grapesjs"></script>
  <script src="editor.js"></script>

</body>
</html>
