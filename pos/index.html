<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Maniac Duren · POS</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('maniac-pos-theme'); } catch {}
        document.documentElement.dataset.theme = ['light','dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <script>
      // Start public configuration while the browser loads the module graph.
      window.posConfigReady = fetch('/api/pos-config', {signal: AbortSignal.timeout(15000)})
        .then(r => r.ok ? r.json() : {}).catch(() => ({}));
    </script>
    <style>
      .pos-loading { min-height:100dvh;display:grid;place-items:center; }
      .pos-loading::after { content:"";width:28px;height:28px;border:3px solid #788f7933;border-top-color:#2bb763;border-radius:50%;animation:pos-spin .8s linear infinite; }
      @keyframes pos-spin { to { transform:rotate(360deg); } }
      @media(prefers-reduced-motion:reduce) { .pos-loading::after { animation:none; } }
    </style>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="pos.css?v=38" />
    <link rel="stylesheet" href="catalog-table.css?v=16.2" />
    <link rel="stylesheet" href="inventory.css?v=16.2" />
    <link rel="stylesheet" href="employees.css?v=25" />
  </head>
  <body>
    <div id="app"><div class="pos-loading" role="status" aria-label="Memuat aplikasi"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module">
      import('./app.js?v=38').catch(error => {
        console.error('POS startup failed',error);
        document.getElementById('app').innerHTML = '<section style="padding:32px"><h2>POS gagal dimuat</h2><p>Muat ulang halaman. Jika tetap gagal, pastikan deployment terbaru sudah selesai.</p><button onclick="location.reload()">Muat ulang</button> <a href="/pos-recover.html">Pulihkan aplikasi</a></section>';
      });
    </script>
  </body>
</html>
