<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Maniac Duren · POS</title>
    <meta name="theme-color" content="#edf4f1" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('maniac-pos-theme'); } catch {}
        document.documentElement.dataset.theme = ['light','dark'].includes(theme) ? theme : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#14211f' : '#edf4f1');
      })();
    </script>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png?v=2" />
    <script type="module">
      import {startPWA} from './pwa.mjs';
      startPWA();
    </script>
    <link rel="stylesheet" href="pos.css?v=125" />
    <link rel="stylesheet" href="ui-tokens.css?v=125" />

    <link rel="stylesheet" href="reports-admin.css?v=125" />

  </head>
  <body>
    <div id="app">
      <div class="auth auth-workspace auth-startup">
        <section class="auth-form">
          <div>
            <img class="auth-logo" src="/assets/logo.png" alt="Maniac Duren" />
            <h1>Menyiapkan POS</h1>
            <div class="auth-progress">
              <div
                class="auth-progress-track"
                role="progressbar"
                aria-label="Memuat POS"
              ></div>
              <p class="auth-progress-text" role="status">Memuat aplikasi…</p>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module">
      import('./app.js').catch(() => {
        document.getElementById('app').innerHTML = '<section style="padding:32px"><h2>POS gagal dimuat</h2><p>Muat ulang halaman. Jika tetap gagal, pastikan deployment terbaru sudah selesai.</p><button onclick="location.reload()">Muat ulang</button></section>';
      });
    </script>
  </body>
