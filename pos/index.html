<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Maniac Duren · POS</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('maniac-pos-theme'); } catch {}
        document.documentElement.dataset.theme = ['light','dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="pos.css?v=16.2" />
    <link rel="stylesheet" href="catalog-table.css?v=16.2" />
    <link rel="stylesheet" href="inventory.css?v=16.2" />
    <link rel="stylesheet" href="employees.css?v=16.2" />
  </head>
  <body>
    <div id="app"><p style="padding:24px">Memuat POS…</p></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module">
      import('./app.js?v=16.2').catch(() => {
        document.getElementById('app').innerHTML = '<section style="padding:32px"><h2>POS gagal dimuat</h2><p>Muat ulang halaman. Jika tetap gagal, pastikan deployment terbaru sudah selesai.</p><button onclick="location.reload()">Muat ulang</button></section>';
      });
    </script>
  </body>
</html>
